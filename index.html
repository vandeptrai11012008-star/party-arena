<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Arena · Live Multiplayer</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#edf4ff;background:#08101f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#263c83 0,transparent 45%),radial-gradient(ellipse at 100% 90%,#3d1858 0,transparent 40%),#08101f}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:clamp(26px,5vw,44px);font-weight:950;letter-spacing:-2px}.logo em{color:#64f4d2;font-style:normal}.tag{font-size:12px;font-weight:800;color:#8ea5c8;letter-spacing:2px}.pill{background:#18294d;border:1px solid #395384;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:800}.panel{background:linear-gradient(160deg,#162340ef,#111b32f2);border:1px solid #344467;border-radius:23px;padding:25px;box-shadow:0 15px 50px #0004}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:24px}h1{font-size:clamp(28px,5vw,50px);line-height:1.08;margin:8px 0 16px}h2{margin:0 0 14px;font-size:22px}p{color:#adc1dc;line-height:1.6}.field{display:block;color:#b5c9e6;font-weight:700;margin:15px 0 6px;font-size:13px}input{width:100%;background:#08152a;color:white;border:1px solid #486089;border-radius:13px;padding:15px;font-size:18px;outline:none}input:focus{border-color:#60e4d2}button{border:0;cursor:pointer;font-weight:850;border-radius:13px;padding:14px 19px;background:#5ee8c9;color:#072a30;font-size:15px;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:default}.alt{background:#293a62;color:#eaf2ff}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.options button{min-height:90px;background:#243b67;color:white;font-size:20px;border:1px solid #486caa}.options button:hover{background:#355590}.muted{color:#8ba2c5;font-size:13px}.code{font-size:clamp(38px,7vw,70px);font-weight:950;letter-spacing:7px;color:#77f6d8}.player{display:flex;align-items:center;justify-content:space-between;background:#172949;border:1px solid #2c4269;border-radius:13px;padding:12px;margin:8px 0}.score{color:#65eac9;font-weight:900}.bar{height:10px;background:#273858;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4ddcbf,#9d8aff);transition:width .4s}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#172a4c;border-radius:13px;padding:12px 17px;font-size:13px}.stat b{display:block;font-size:21px;color:white}.notice{background:#1e3354;border-left:3px solid #68f1d0;padding:14px;border-radius:8px;margin-top:15px}.error{color:#ff9b9b;min-height:20px}.hidden{display:none!important}.seq{display:flex;gap:10px;flex-wrap:wrap}.tile{padding:16px 21px;background:#2d4470;border-radius:13px;font-size:30px}.center{text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.actions button{min-width:140px}.big{font-size:30px;font-weight:900}.foot{margin-top:25px;color:#7f96b5;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:18px}.options button{min-height:75px}.wrap{padding:18px 12px}.code{letter-spacing:3px}.actions{flex-direction:column}.actions button{width:100%}}
</style></head><body><div class="wrap"><header class="head"><div><div class="tag">EXPLORE & EARN PRESENTS</div><div class="logo">PARTY <em>ARENA</em></div></div><span class="pill">⚡ LIVE MULTIPLAYER</span></header><main id="app" class="grid"></main><div class="foot">2–8 players · 6 rounds · Browser-based · Live server-controlled scoring</div></div><script>
let token=localStorage.getItem('partyToken')||'',state=null,source=null,clock=null,memory=[],patternCount=0,err='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(endpoint,data){const r=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function connect(){if(source)source.close();source=new EventSource('/events?token='+encodeURIComponent(token));source.onmessage=e=>{const prev=state;state=JSON.parse(e.data);if(!prev||prev.phase!==state.phase||prev.roundIndex!==state.roundIndex||prev.round?.step!==state.round?.step||prev.round?.question!==state.round?.question||prev.round?.submitted!==state.round?.submitted||Boolean(prev.round?.sequence)!==Boolean(state.round?.sequence)||prev.host!==state.host||prev.players.length!==state.players.length||prev.spectators.length!==state.spectators.length||prev.players.some((p,i)=>p.id!==state.players[i]?.id||p.online!==state.players[i]?.online))render();else updateLive()};source.onerror=()=>{if(!state) {localStorage.removeItem('partyToken');token='';render()}}}
function left(){return Math.max(0,Math.ceil(((state?.endAt||0)-Date.now())/1000))}function status(){return state?.phase==='play'?'🎮 PLAYING':state?.phase==='countdown'?'⏳ STARTING':state?.phase==='results'?'🏆 RESULTS':state?.phase==='tie'?'⚡ TIEBREAKER':state?.phase==='done'?'🏁 FINISHED':'🟢 LOBBY'}
function list(){return [...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player"><span>${i+1}. ${esc(p.name)} ${p.id===state.host?'👑':''} ${p.id===state.me?'(you)':''}</span><span class="score">${p.score} ${state.phase==='play'?(p.answered?'✓':'…'):''}</span></div>`).join('')}
function render(){const a=$('app');if(!state){a.innerHTML=`<section class="panel"><div class="tag">PLAY TOGETHER, FROM ANYWHERE</div><h1>Six rounds.<br>One champion.</h1><p>Compete in trivia, memory, guessing and pattern challenges. Each friend joins on their own phone or computer.</p><label class="field">YOUR NICKNAME</label><input id="name" maxlength="20" placeholder="Enter your name" value="${esc(localStorage.getItem('partyName')||'')}"><div class="options"><button onclick="createRoom()">✨ Create Room</button><button class="alt" onclick="joinRoom()">🔑 Join Room</button></div><div class="error" id="error">${esc(err)}</div></section><aside class="panel"><h2>Join with a code</h2><p>Ask your friend for their six-character room code.</p><label class="field">ROOM CODE</label><input id="room" maxlength="6" placeholder="FUN8KP" style="text-transform:uppercase"><div class="notice">Host creates the room. Other players join using the same address and room code.</div></aside>`;return}
const me=state.players.find(p=>p.id===state.me),host=state.host===state.me,round=state.round,phase=state.phase;
let leftPanel='';if(phase==='lobby'){leftPanel=`<div class="tag">PRIVATE PARTY ROOM</div><div class="code">${state.code}</div><p>Share this code with your friends. Everyone must open this website on their own device.</p><div class="notice">${state.players.length}/8 players ready · Minimum 2 to start</div><div class="actions">${host?`<button onclick="start()" ${state.players.length<2?'disabled':''}>🚀 Start Match</button><button class="alt" onclick="copyCode()">📋 Copy Code</button>`:'<p>Waiting for the host to start…</p>'}</div>`}
else if(phase==='countdown'){leftPanel=`<div class="tag">ROUND ${state.roundIndex+1} OF 6</div><h1>${esc(round.title)}</h1><p>Get ready! The next challenge starts in</p><div class="big" id="timer">${left()}s</div>`}
else if(phase==='play'||phase==='tie'){const memoryReveal=round.type==='memory'&&round.sequence;let game='';if(round.type==='memory'){game=memoryReveal?`<p>Memorize this sequence:</p><div class="seq">${round.sequence.map(i=>`<span class="tile">${round.options[i]}</span>`).join('')}</div><p>It will disappear after 5 seconds.</p>`:`<p>Tap four symbols in the same order (${memory.length}/4).</p><div class="options">${round.options.map((x,i)=>`<button onclick="memoryTap(${i})">${x}</button>`).join('')}</div><div class="notice">Your input: ${memory.map(i=>round.options[i]).join(' ')||'—'}</div>`}
else if(round.type==='guess'){game=`<label class="field">YOUR ESTIMATE</label><input id="guess" type="number" inputmode="numeric" placeholder="Enter a number"><button style="margin-top:12px" onclick="submitGuess()">Submit estimate</button>`}
else{game=`<div class="options">${round.options.map((x,i)=>`<button onclick="answer(${i})">${esc(x)}</button>`).join('')}</div>`}
leftPanel=`<div class="row"><div class="tag">${phase==='tie'?'SUDDEN DEATH':'ROUND '+(state.roundIndex+1)+' / 6'}</div><div class="pill" id="timer">${left()}s</div></div><h1>${esc(round.title)}</h1><p>${esc(round.question)}</p>${round.submitted?'<div class="notice">✓ Answer locked! Waiting for other players…</div>':game}`}
else if(phase==='results'){leftPanel=`<div class="tag">ROUND ${state.roundIndex+1} COMPLETE</div><h1>Round Results</h1>${(state.results||[]).map((p,i)=>`<div class="player"><span>${i+1}. ${esc(p.name)}</span><span class="score">+${p.points} pts</span></div>`).join('')}<p>Next round begins in <b id="timer">${left()}s</b>.</p>`}
else{leftPanel=`<div class="tag">MATCH COMPLETE</div><h1>🏆 ${esc(state.champion||'Winner')}!</h1><p>Congratulations! Here are the final scores.</p>${list()}${host?'<div class="actions"><button onclick="start()">🔄 Play Again</button><button class="alt" onclick="backToLobby()">↩ Back to Lobby</button></div>':'<p>Waiting for host to start a rematch…</p>'}`}
a.innerHTML=`<section class="panel">${leftPanel}<div class="error" id="error">${esc(err)}</div></section><aside class="panel"><div class="row"><h2>Leaderboard</h2><span class="pill">${status()}</span></div><div class="stats"><div class="stat">ROOM<b>${state.code}</b></div><div class="stat">PLAYERS<b>${state.players.length}/8</b></div></div><div style="margin-top:15px">${list()}</div>${state.spectators.length?`<p>Watching: ${state.spectators.map(x=>esc(x.name)).join(', ')}</p>`:''}${host&&phase!=='lobby'&&phase!=='done'?'<div class="actions"><button class="alt" onclick="backToLobby()">↩ Back to Lobby</button></div>':''}<p class="muted">Score limit: 150 points per round · 900 max per match</p></aside>`}
function updateLive(){if($('timer'))$('timer').textContent=left()+'s';if(state?.phase==='play') {const listNodes=document.querySelectorAll('aside .player');listNodes.forEach((el,i)=>{const p=[...state.players].sort((a,b)=>b.score-a.score)[i];if(p)el.querySelector('.score').textContent=p.score+' '+(p.answered?'✓':'…')})}}
async function createRoom(){try{const name=$('name').value.trim();if(!name)throw Error('Enter your nickname');localStorage.setItem('partyName',name);const j=await call('create',{name});token=j.token;localStorage.setItem('partyToken',token);connect()}catch(e){err=e.message;render()}}
async function joinRoom(){try{const name=$('name').value.trim(),code=$('room').value.trim().toUpperCase();if(!name||code.length!==6)throw Error('Enter a nickname and 6-character room code');localStorage.setItem('partyName',name);const j=await call('join',{name,code});token=j.token;localStorage.setItem('partyToken',token);connect()}catch(e){err=e.message;render()}}
async function start(){try{err='';memory=[];await call('start',{token})}catch(e){err=e.message;render()}}
async function backToLobby(){try{err='';memory=[];patternCount=0;await call('lobby',{token})}catch(e){err=e.message;render()}}
async function copyCode(){try{await navigator.clipboard.writeText(state.code);err='Room code copied!';render()}catch(e){err='Your room code: '+state.code;render()}}
async function answer(answer){try{await call('answer',{token,answer})}catch(e){err=e.message;render()}}
async function submitGuess(){const input=$('guess');if(!input||!input.value.trim()){err='Please enter a number first.';render();return}const value=Number(input.value);if(!Number.isFinite(value)){err='Please enter a valid number.';render();return}await answer(value)}
async function memoryTap(i){memory.push(i);if(memory.length===4){const answerCopy=[...memory];memory=[];try{await call('answer',{token,answer:answerCopy})}catch(e){err=e.message;render()}}else render()}
setInterval(()=>{if(state)updateLive()},250);if(token)connect();else render();
</script></body></html>
